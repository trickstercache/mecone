# HAProxy reverse proxy with its small-object cache enabled, forwarding every path to the origin.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

# total-max-size is in MB; max-object-size must stay under total-max-size/8
cache mecone
    total-max-size 256
    max-object-size 8388608
    max-age 3600
    # cache responses that carry Vary rather than skipping them
    process-vary on

frontend mecone_fe
    bind :${LISTEN_PORT}
    http-request cache-use mecone
    http-response cache-store mecone
    default_backend mecone_be

backend mecone_be
    server origin ${ORIGIN_HOST}:${ORIGIN_PORT}
