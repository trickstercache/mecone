# Squid as a reverse proxy (accelerator) cache in front of the Mecone origin.
# no-vhost is squid's usual accelerator mode: it keys the cache on the path rather than on the
# client's Host, which vhost mode cannot do when that Host is a bare address and port.

http_port ${LISTEN_PORT} accel defaultsite=mecone.invalid no-vhost

# resolve the origin by DNS rather than /etc/hosts: where docker gives the host both an IPv4 and
# an IPv6 address there, squid picks the IPv6 one, cannot reach it, and leaves the peer dead
hosts_file none

cache_peer ${ORIGIN_HOST} parent ${ORIGIN_PORT} 0 no-query originserver name=mecone
cache_peer_access mecone allow all
http_access allow all

# a small memory-only cache: the test objects are tiny, squid's disk store would have to be
# initialized before every run, and a large cache_mem exhausts the container
cache_mem 64 MB
maximum_object_size_in_memory 8 MB

# squid's stock heuristic, for responses that carry no explicit freshness of their own;
# an origin that states its freshness still decides it
refresh_pattern . 0 20% 4320

# write the log directly rather than through squid's log daemon helper: a broken pipe to that
# helper is fatal to squid, and the image's entrypoint already tails this file to stdout
access_log stdio:/var/log/squid/access.log
