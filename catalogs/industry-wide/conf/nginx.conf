# nginx reverse proxy with proxy_cache enabled, forwarding every path to the Mecone origin.
# nginx variables are written as ${name}, which Mecone's ${...} expansion leaves untouched.

worker_processes auto;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout combined;

    # freshness and validation come from the origin's headers; no proxy_cache_valid overrides them
    proxy_cache_path /var/cache/nginx/mecone levels=1:2 keys_zone=mecone:16m max_size=512m
                     inactive=1h use_temp_path=off;

    server {
        listen ${LISTEN_PORT};
        server_name _;

        location / {
            proxy_pass ${ORIGIN_URL};
            proxy_http_version 1.1;
            # keep the client's Host rather than nginx's default rewrite to the upstream host
            proxy_set_header Host ${host};
            proxy_cache mecone;
            proxy_cache_methods GET HEAD;
            proxy_cache_key ${scheme}${proxy_host}${request_uri};
        }
    }
}
